# Local development database server (sqld).
#
# `vp dev` runs the server code inside workerd (Cloudflare Workers runtime),
# whose @libsql/client web build only speaks http:/https:/ws: — it cannot open
# local `file:` SQLite databases. This service provides a real LibSQL server
# on http://127.0.0.1:8080 so the dev server can talk to a local database.
#
# Start it with:  docker compose -f docker-compose.dev.yml up -d
# Then point .env at it:
#   DATABASE_MODE=remote
#   TURSO_DATABASE_URL=http://127.0.0.1:8080

services:
    sqld:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
            - "127.0.0.1:8080:8080"
        command: ["sqld", "--http-listen-addr", "0.0.0.0:8080"]
        environment:
            SQLD_NODE_ID: "1"
        volumes:
            - learnmap-sqld-data:/var/lib/sqld
        restart: unless-stopped

volumes:
    learnmap-sqld-data:
